[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ou-xgboost-energy"
version = "0.1.0"
description = "Causal next-day electricity price forecasting with Ornstein-Uhlenbeck dynamics and gradient boosting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Behnam Mohseni Gharyehsafa"}]
keywords = ["electricity", "forecasting", "ornstein-uhlenbeck", "xgboost", "energy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.4,<2", "threadpoolctl>=3.1,<4"]

[project.optional-dependencies]
xgb = ["xgboost>=2.0,<4"]
plots = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
energy-forecast = "energy_forecast.cli:main"

[project.urls]
Homepage = "https://github.com/BehnamMohseniGharyehsafa/ou-xgboost-energy"
Issues = "https://github.com/BehnamMohseniGharyehsafa/ou-xgboost-energy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
