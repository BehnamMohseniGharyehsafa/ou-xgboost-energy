<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">OU + XGBoost Energy</title>
  <desc id="desc">Electricity price forecasting with stochastic dynamics and machine learning. A conceptual mean-reverting price path merges into a forecast curve.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071b2c"/><stop offset="1" stop-color="#123c49"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#63d6cb" stop-opacity=".25"/><stop offset="1" stop-color="#63d6cb"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9bc5cf" stroke-opacity=".065"/></pattern>
    <clipPath id="panel"><rect x="750" y="70" width="470" height="242" rx="12"/></clipPath>
  </defs>
  <rect width="1280" height="390" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="390" rx="18" fill="url(#grid)"/>
  <rect x="55" y="49" width="7" height="28" rx="3" fill="#63d6cb"/>
  <text x="78" y="69" fill="#8ab8c4" font-family="Arial, sans-serif" font-size="15" letter-spacing="3">ENERGY MARKET RESEARCH</text>
  <text x="54" y="156" fill="#f3f7fa" font-family="Arial, sans-serif" font-size="59" font-weight="700">OU + XGBoost</text>
  <text x="57" y="204" fill="#63d6cb" font-family="Arial, sans-serif" font-size="28">Electricity price forecasting</text>
  <text x="57" y="251" fill="#b5c9d4" font-family="Arial, sans-serif" font-size="18">Stochastic dynamics meet machine learning.</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#d5e3e9">
    <rect x="57" y="293" width="163" height="33" rx="16" fill="#183e4c"/><text x="76" y="315">CAUSAL FEATURES</text>
    <rect x="232" y="293" width="183" height="33" rx="16" fill="#183e4c"/><text x="250" y="315">ROLLING EVALUATION</text>
    <rect x="427" y="293" width="143" height="33" rx="16" fill="#183e4c"/><text x="446" y="315">CPU / CUDA</text>
  </g>
