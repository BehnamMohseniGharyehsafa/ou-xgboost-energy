name: Scientific Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=energy_forecast --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: energy-forecast --help

  xgboost:
    name: XGBoost CPU and plotting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,xgb,plots]"
      - run: python -m pytest
      - run: energy-forecast demo --days 170 --out outputs/ci-prices.csv
      - run: energy-forecast backtest --csv outputs/ci-prices.csv --backend xgboost --device cpu --plots --out outputs/ci-backtest
      - run: energy-forecast forecast --csv outputs/ci-prices.csv --backend xgboost --device cpu --out outputs/ci-forecast
